name: Global CMT Breakout Screener

# DO NOT read these cron lines as "the alert time" — they are wake-ups, not
# the schedule. GitHub Actions cron is unreliable: measured on this repository,
# a single '0 13 * * *' entry actually executed at 18:21, 23:02, 20:31, 20:31,
# 22:13 and 22:03 UTC on consecutive days (5-10 hours late, every day).
#
# Firing mid-session is not harmless: candidates get discovered from TODAY's
# intraday movers while the analysis correctly uses the last COMPLETED candle,
# so those names show no breakout and are all rejected. That is why US names
# were silently missing from the alerts while Asia/Gulf names came through.
#
# So the job now wakes hourly and screener/rungate.py decides whether the
# moment is suitable:
#   * any covered market still trading  -> skip (data would be partial)
#   * this session set already alerted   -> skip (no duplicates)
# Skipped wake-ups exit in seconds, before any data is downloaded.
#
# Result: exactly one alert per session set, every market complete, delivered
# as soon after the all-closed window opens as GitHub allows. For delivery at
# a precise clock time, drive workflow_dispatch from an external cron instead.
on:
  schedule:
    # BILLING NOTE: GitHub charges per minute ROUNDED UP, so a wake-up that
    # skips in 15 seconds still costs a full billed minute. Wake-up count is
    # therefore roughly minutes-per-day. Keep this list short: an earlier
    # */10 schedule came to ~39 runs/day (~1,200 min/month against a 2,000
    # free-minute allowance) and led to jobs being cancelled.
    #
    # EVERY slot below is one where all nine markets are shut in BOTH DST
    # regimes - verified, not assumed. Only two such windows exist per day:
    #
    #   13:00-13:20 UTC  (17:00-17:20 Dubai)  US not yet open -> reports yesterday
    #   21:00-22:30 UTC  (01:00-02:30 Dubai)  US closed       -> reports today
    #
    # 13:40 UTC is NOT usable (US opens 13:30 UTC on EDT) and 14:00-20:30 can
    # never alert at all, so earlier entries there were pure waste. GitHub
    # drops scheduled runs freely, so the point of multiple entries is simply
    # to have several chances inside a window that can actually fire.
    #
    # Preferred window - the requested 17:00 Dubai delivery.
    - cron: '0,10,20 13 * * *'
    # Fallback window - only reached if every attempt above was dropped, and
    # it carries a bonus: by then the US has closed, so it reports TODAY.
    - cron: '0,30 21,22 * * *'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab
    inputs:
      force_run:
        description: 'Bypass the trading-day gate (for testing)'
        required: false
        default: 'false'

# Lets the job push a small heartbeat commit back to the repo after each run.
# That daily activity keeps GitHub from silently parking the schedule, and
# leaves a visible "last ran" marker in last_run.txt.
permissions:
  contents: write

# Wake-ups must never pile up or race each other: two runs pushing the state
# commit at once is how the dedup file gets lost. Queue them instead, and never
# cancel a run that is already doing real work.
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # A healthy run finishes in ~2 minutes; this stops a hung run from burning
    # the monthly allowance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Decide FIRST, using only the standard library, before paying for a
      # dependency install. A skipped wake-up therefore costs a few seconds.
      - name: Should this wake-up run?
        id: gate
        env:
          MARKETS:             'ALL'
          RUN_NOT_BEFORE_UTC:  '13:00'
          FORCE_RUN:           ${{ github.event.inputs.force_run || 'false' }}
        run: python3 gatecheck.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Fast unit tests (no network) — catches a broken deploy BEFORE the
      # screen runs, rather than discovering it from a silent empty alert.
      - name: Run tests
        if: steps.gate.outputs.proceed == 'true'
        run: python -m pytest tests/ -q

      - name: Run screener
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- universe --------------------------------------------------
          # US=NYSE/NASDAQ  AU=ASX  IN=NSE/BSE  PK=PSX  SA=Tadawul
          # KW=Kuwait  EG=EGX  AE=DFM/ADX  QA=Qatar   ("ALL" = every market)
          MARKETS:            'ALL'
          SCREENER_LIMIT:     '80'    # movers examined per discovered market
          # --- delivery timing -------------------------------------------
          # 13:00 UTC = 17:00 Dubai. Every market (US, ASX, India, Pakistan,
          # Tadawul, Kuwait, Egypt, UAE, Qatar) is closed by then, verified in
          # both DST regimes. The gate will not fire before this.
          RUN_NOT_BEFORE_UTC: '13:00'
          ALLOW_LATE_FALLBACK: 'true'  # still send if GitHub misses the window
          # --- liquidity (institutions cannot trade illiquid names) -------
          MIN_PRICE:          '5'
          MIN_DOLLAR_VOL:     '10000000'
          MIN_CHANGE_PCT:     '1.5'
          # --- breakout quality ------------------------------------------
          MIN_VOL_RATIO:      '1.4'   # volume expansion vs 50-day average
          MIN_CLOSE_RANGE_POS: '0.55' # close in upper half of the day's range
          MAX_EXT_FROM_PIVOT: '8.0'   # do not chase extended breakouts
          MIN_RS_RATING:      '70'    # must outperform the market
          MIN_RR:             '2.0'   # minimum reward:risk
          MIN_SCORE:          '70'
          MAX_ALERTS:         '20'
          INCLUDE_GRADE_B:    'true'
          # --- watchlist: set up but not yet triggered --------------------
          WATCH_ENABLED:      'true'
          WATCH_WITHIN_PCT:   '4.0'   # how close beneath the pivot to track
          MAX_WATCH:          '10'
          FORCE_RUN:          ${{ github.event.inputs.force_run || 'false' }}
        run: python cmt_screener.py

      - name: Upload results
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: |
            cmt_breakout_setups.csv
          if-no-files-found: ignore
          retention-days: 30

      # Persists .screener_state.json (which session set was last alerted) so a
      # later wake-up today does not repeat the same alert, and last_run.txt so
      # the repo never looks idle to GitHub's 60-day inactivity check.
      # Only on wake-ups that actually ran, so skipped ones leave no commit
      # noise. Rebases before pushing because wake-ups can overlap.
      - name: Persist run state
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ  (run #${GITHUB_RUN_NUMBER})" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt .screener_state.json 2>/dev/null || git add last_run.txt
          git commit -m "chore: screener state" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && break
            echo "push retry $i"; sleep 5
          done
