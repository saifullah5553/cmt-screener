name: CMT Breakout Screener

# Runs every weekday at 21:30 UTC = after the 4:00pm ET US close year-round
#   * EDT (summer): 21:30 UTC = 17:30 ET
#   * EST (winter): 21:30 UTC = 16:30 ET
# GitHub cron is always UTC and does NOT observe daylight saving, so a fixed
# UTC time is intentional. The script skips US market holidays itself; the
# 1-5 (Mon-Fri) filter excludes weekends.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab
    inputs:
      force_run:
        description: 'Bypass the trading-day gate (for testing)'
        required: false
        default: 'false'

# Lets the job push a small heartbeat commit back to the repo after each run.
# That daily activity keeps GitHub from silently parking the schedule, and
# leaves a visible "last ran" marker in last_run.txt.
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_LIMIT:     '50'
          MIN_PRICE:          '5'
          MIN_CHANGE_PCT:     '2.0'
          MIN_DOLLAR_VOL:     '5000000'
          INCLUDE_GRADE_B:    'true'
          MIN_RR:             '2.0'
          FORCE_RUN:          ${{ github.event.inputs.force_run || 'false' }}
        run: python cmt_screener.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: |
            cmt_breakout_setups.csv
          if-no-files-found: ignore
          retention-days: 30

      # Heartbeat: always leaves a fresh commit so the repo never looks idle and
      # GitHub keeps firing the daily schedule. Runs even if the screener step
      # failed, so a quiet day still counts as activity.
      - name: Heartbeat commit (keeps the daily schedule alive)
        if: always()
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ  (run #${GITHUB_RUN_NUMBER})" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: screener heartbeat" || echo "nothing to commit"
          git push
