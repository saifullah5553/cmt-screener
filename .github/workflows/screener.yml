name: CMT Breakout Screener

# Runs every morning at 05:15 UTC = 09:15 Dubai time (GMT+4), every day.
# At that hour the US market is already closed (00:15-01:15 ET) and the next
# session hasn't opened, so the script analyzes YESTERDAY's completed US
# session (see resolve_session() in cmt_screener.py). It self-skips on days
# with nothing new (weekends / holidays), so a daily cron is safe and keeps
# the repo active for the heartbeat. GitHub cron is always UTC (no DST); Dubai
# has no DST either, so 05:15 UTC == 09:15 Dubai year-round.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab
    inputs:
      force_run:
        description: 'Bypass the trading-day gate (for testing)'
        required: false
        default: 'false'

# Lets the job push a small heartbeat commit back to the repo after each run.
# That daily activity keeps GitHub from silently parking the schedule, and
# leaves a visible "last ran" marker in last_run.txt.
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fast unit tests (no network) — catches a broken deploy BEFORE the
      # screen runs, rather than discovering it from a silent empty alert.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- universe --------------------------------------------------
          SCREENER_LIMIT:     '120'   # movers examined per session
          INCLUDE_US:         'true'  # NYSE / NASDAQ / AMEX
          INCLUDE_ASX:        'true'  # Australian Securities Exchange
          # --- liquidity (institutions cannot trade illiquid names) -------
          MIN_PRICE:          '5'
          MIN_DOLLAR_VOL:     '10000000'
          MIN_CHANGE_PCT:     '1.5'
          # --- breakout quality ------------------------------------------
          MIN_VOL_RATIO:      '1.4'   # volume expansion vs 50-day average
          MIN_CLOSE_RANGE_POS: '0.55' # close in upper half of the day's range
          MAX_EXT_FROM_PIVOT: '8.0'   # do not chase extended breakouts
          MIN_RS_RATING:      '70'    # must outperform the market
          MIN_RR:             '2.0'   # minimum reward:risk
          MIN_SCORE:          '70'
          MAX_ALERTS:         '20'
          INCLUDE_GRADE_B:    'true'
          # --- watchlist: set up but not yet triggered --------------------
          WATCH_ENABLED:      'true'
          WATCH_WITHIN_PCT:   '4.0'   # how close beneath the pivot to track
          MAX_WATCH:          '10'
          FORCE_RUN:          ${{ github.event.inputs.force_run || 'false' }}
        run: python cmt_screener.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: |
            cmt_breakout_setups.csv
          if-no-files-found: ignore
          retention-days: 30

      # Heartbeat: always leaves a fresh commit so the repo never looks idle and
      # GitHub keeps firing the daily schedule. Runs even if the screener step
      # failed, so a quiet day still counts as activity.
      - name: Heartbeat commit (keeps the daily schedule alive)
        if: always()
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ  (run #${GITHUB_RUN_NUMBER})" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: screener heartbeat" || echo "nothing to commit"
          git push
