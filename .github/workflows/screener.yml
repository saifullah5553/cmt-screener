name: CMT Breakout Screener

# Runs every weekday at 21:30 UTC.
#   - After the 4:00pm ET US market close year-round:
#       * EDT (summer): 21:30 UTC = 17:30 ET
#       * EST (winter): 21:30 UTC = 16:30 ET
#   - The script itself skips US market HOLIDAYS (weekends are excluded by the
#     cron day-of-week filter 1-5 = Mon-Fri).
# GitHub may delay scheduled runs by a few minutes under load — that's fine here.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:        # allows a manual "Run workflow" button in the Actions tab
    inputs:
      force_run:
        description: 'Bypass the trading-day gate (for testing)'
        required: false
        default: 'false'

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_LIMIT:     '50'
          MIN_PRICE:          '5'
          MIN_CHANGE_PCT:     '2.0'
          MIN_DOLLAR_VOL:     '5000000'
          INCLUDE_GRADE_B:    'true'
          MIN_RR:             '2.0'
          FORCE_RUN:          ${{ github.event.inputs.force_run || 'false' }}
        run: python cmt_screener.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: |
            cmt_breakout_setups.csv
          if-no-files-found: ignore
          retention-days: 30
