name: CMT Breakout Screener

# Runs daily at 13:00 UTC = 17:00 Dubai (GMT+4).
#
# Every covered market is closed at this moment, year-round through both DST
# regimes. Measured all-closed windows: 12:30-14:00 UTC in January and
# 12:00-13:00 UTC in July — 13:00 is the latest slot inside both.
#
#   Closed by then (same-day sessions):
#     KW 09:30 · NSE/BSE 10:00 · QA 10:15 · PSX 10:30 · AE 11:00
#     SA 12:00 · EG 12:30 UTC · ASX closed 05:00-06:00 UTC
#   US NYSE/NASDAQ has NOT yet opened (13:30 UTC EDT / 14:30 UTC EST),
#     so the US reports YESTERDAY's completed session — intended.
#
# Each market resolves its own last COMPLETED session (screener/markets.py),
# so nothing is ever analysed mid-trade. If GitHub fires the job late and the
# US has opened, the US simply falls back to the same previous close.
#
# GitHub cron is always UTC and observes no DST; Dubai has no DST either.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab
    inputs:
      force_run:
        description: 'Bypass the trading-day gate (for testing)'
        required: false
        default: 'false'

# Lets the job push a small heartbeat commit back to the repo after each run.
# That daily activity keeps GitHub from silently parking the schedule, and
# leaves a visible "last ran" marker in last_run.txt.
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fast unit tests (no network) — catches a broken deploy BEFORE the
      # screen runs, rather than discovering it from a silent empty alert.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- universe --------------------------------------------------
          # US=NYSE/NASDAQ  AU=ASX  IN=NSE/BSE  PK=PSX  SA=Tadawul
          # KW=Kuwait  EG=EGX  AE=DFM/ADX  QA=Qatar   ("ALL" = every market)
          MARKETS:            'ALL'
          SCREENER_LIMIT:     '80'    # movers examined per discovered market
          # --- liquidity (institutions cannot trade illiquid names) -------
          MIN_PRICE:          '5'
          MIN_DOLLAR_VOL:     '10000000'
          MIN_CHANGE_PCT:     '1.5'
          # --- breakout quality ------------------------------------------
          MIN_VOL_RATIO:      '1.4'   # volume expansion vs 50-day average
          MIN_CLOSE_RANGE_POS: '0.55' # close in upper half of the day's range
          MAX_EXT_FROM_PIVOT: '8.0'   # do not chase extended breakouts
          MIN_RS_RATING:      '70'    # must outperform the market
          MIN_RR:             '2.0'   # minimum reward:risk
          MIN_SCORE:          '70'
          MAX_ALERTS:         '20'
          INCLUDE_GRADE_B:    'true'
          # --- watchlist: set up but not yet triggered --------------------
          WATCH_ENABLED:      'true'
          WATCH_WITHIN_PCT:   '4.0'   # how close beneath the pivot to track
          MAX_WATCH:          '10'
          FORCE_RUN:          ${{ github.event.inputs.force_run || 'false' }}
        run: python cmt_screener.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: |
            cmt_breakout_setups.csv
          if-no-files-found: ignore
          retention-days: 30

      # Heartbeat: always leaves a fresh commit so the repo never looks idle and
      # GitHub keeps firing the daily schedule. Runs even if the screener step
      # failed, so a quiet day still counts as activity.
      - name: Heartbeat commit (keeps the daily schedule alive)
        if: always()
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ  (run #${GITHUB_RUN_NUMBER})" > last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: screener heartbeat" || echo "nothing to commit"
          git push
